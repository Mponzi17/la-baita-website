server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # HTML and config.js change at launch; always revalidate them
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /assets/js/config.js { add_header Cache-Control "no-cache"; }

    # Images, video, CSS and JS: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }

    # Keep the spec, backups and container files private
    location ~ ^/(SPEC\.md|index\.v1\.html|Dockerfile|nginx\.conf|\.claude) { return 404; }
}
